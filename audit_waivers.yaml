# audit_waivers.yaml — 감사 예외 선언 (저장소 루트, 사람이 쓴다). FR38.10 · DESIGN §5.11
#
# 1차 예외는 **문서 안의 표준 표기**로 표현한다 — `(구현 없음 — …)` · `**테스트 미구현**` ·
# `(구현 예정)` · §9.1a 위치 열. 예외는 그것을 설명하는 문장 옆에 있어야 함께 갱신된다.
# 이 파일은 1차로 표현할 수 없는 **잔여**만 담는다.
#
# 규약 3가지
#   ⓐ 와일드카드·정규식 금지 — `check`·`target`을 정확히 지정한다
#      (검사 한 종류를 통째로 끌 수 있으면 그것이 첫 은폐 수단이 된다)
#   ⓑ 면제된 발견도 세어서 보여준다(`예외적용 d`) — 완전히 숨기지 않는다
#   ⓒ **대응하는 발견이 없는 항목은 `waiver.stale` 경고**로 올라온다
#      — 예외가 자기 수명을 스스로 신고하게 만드는 유일한 장치다
# `expires`는 **선택** 필드다(만료를 강제하면 만료 관리가 새 수작업이 된다).
waivers:
  - check: audit.traceability
    target: "Reprocessor"
    reason: "FR5 행의 '(Extractor 재사용)' 개념명 — 같은 이름의 클래스는 존재하지 않는 것이 정상"
    added: "2026-09-26"
    # expires: "2027-03-31"            # (선택) 이 날짜 이후에는 면제하지 않고 원래 심각도로 보고
  - check: doctor.meta-fields
    target: "tickers/all-empty"
    reason: "DQ-43 — 이 코퍼스의 정답이 빈 값이다(실측 495/495). 느슨하게 되돌리지 말 것(FR12.6)"
    added: "2026-09-26"
  - check: doctor.detector-fossils
    target: "변곡점주식/aetOCkgzurM"
    reason: "해소된 과거 사건의 화석 — 2026-09-24에 FR13.7·DQ-38으로 멤버십 감지 규칙을 고쳤고(availability 1차·한/영 메시지 2차, video_access.py), 이 행은 그 이전(2026-09-09~24 고장 구간)에 error로 기록된 것이다. extract_log.csv는 append-only 감사 기록이라 고칠 수 없다(해당 영상을 재추출하면 현행 규칙이 members_only로 올바로 분류한다). 심각도는 내리지 않았다 — 이 waiver는 이 1행만 면제하고, 새 화석이 생기면 그것은 규칙이 또 뚫렸다는 진짜 신호로 오류가 된다"
    added: "2026-09-26"
  - check: doctor.meta-fields
    target: "modified_date/all-empty"
    reason: "FR2.6·DQ-12 — YouTube flat 스캔이 수정일을 주지 않아 전 코퍼스가 None인 것이 정상이다(state는 upload_date로 폴백)"
    added: "2026-09-26"
