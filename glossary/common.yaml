# glossary/common.yaml — 주제 무관 STT 습관 오류. FR40.6
#
# **비어 있는 것이 현재 정상 상태다.** 사전은 가이드를 베끼지 않고 이 코퍼스 실측으로
# 만든다(FR40.18·DQ-64): 561편 전수 대조에서 가이드가 확실(○)로 준 항목조차 무너졌다
# (`디어`→DEER = 617건/192편 **전량 오탐**). 채택 절차는
#   ./yt.sh terms [폴더|채널] --from glossary/seeds/guide-2026-08.txt
# 출력의 **어절 분포**와 문맥 샘플을 사람이 보고 채택·배제 조건을 확정해 여기 적는 것이다.
#
# 항목 하나에는 `variants[].word_exact` / `left_exclude`·`right_exclude` / `require` 중
# **하나가 반드시** 있어야 한다 — 없으면 사전 로드가 `ValueError`로 실패한다(FR40.5·DQ-65).
# 한국어는 어절 내부에 경계가 없어 그 조건이 유일한 안전장치다.
#
# 예시(주석 — 실측 확인 전에는 켜지 않는다):
# - canonical: 딸깍
#   variants:
#     - text: 딸각
#       word_exact: true
#   domain: common
#   confidence: high
#   note: 실측 필요 — `terms`로 어절 분포를 확인한 뒤 채택
#   source: corpus-YYYY-MM-DD
